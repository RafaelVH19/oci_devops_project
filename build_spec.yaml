version: 0.1 
component: build
timeoutInSeconds: 1200
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm-java22

  exportedVariables:
    - BuildServiceDemoVersion

steps:
  - type: Command
    name: "Install GraalVM Enterprise 22.x Native Image for Java22"
    command:  yum -y install graalvm-22-jdk.x86_64;
              ls /usr/lib64/graalvm/

  - type: Command
    name: "Set PATH Variable"
    command: export PATH=$JAVA_HOME/bin:$PATH

  - type: Command
    name: "Docker Login"
    command:  cd MtdrSpring;
              oci os object get --bucket-name equipo55-n6xne --name deployment_config.tgz --file deployment_config.tgz;
              tar -xzvf deployment_config.tgz;
              source env.sh;
              docker logout;
              docker logout mx-queretaro-1.ocir.io;
              cat at.cfg | docker login -u "axtmrhnjpl9j/a00839223@tec.mx" --password-stdin mx-queretaro-1.ocir.io

  - type: Command
    name: "Build"
    command:  cd MtdrSpring;
              source env.sh;
              (cd backend;source build.sh);
              export BuildServiceDemoVersion=$(git rev-parse --short HEAD)

  - type: Command
    name: "Install K8s"
    command:  mkdir -p $HOME/.kube;
              cd $HOME;
              ls -la;
              mkdir k8s;
              ls -la;
              cd k8s;
              wget https://dl.k8s.io/v1.31.2/bin/linux/amd64/kubectl;
              ls -la;
              chmod +x kubectl;
              export PATH=$PATH:$HOME/k8s;
              kubectl version --client;
              cd ..;
              cd .kube;
              oci ce cluster create-kubeconfig
              --cluster-id ocid1.cluster.oc1.mx-queretaro-1.aaaaaaaaznash4kngku5kb2c2zl3exarg55oscfv5uq4ri7iecyckka6emgq
              --file $HOME/.kube/config --region mx-queretaro-1 --token-version 2.0.0 
              --kube-endpoint PUBLIC_ENDPOINT;
              export KUBECONFIG=$HOME/.kube/config;

  - type: Command
    name: "Undeploy"
    ignoreFailure: True
    command: export PATH=$PATH:$HOME/k8s;kubectl version;
      export KUBECONFIG=$HOME/.kube/config;
      cd MtdrSpring;
      source env.sh;
      cd backend;
      ls -l;
      kubectl config view;
      source undeploy.sh;
      