# Spring (:8080) + Better Auth (solo red interna, sin publicar :3001).
# Requiere JAR previo: mvn clean package (o verify) en backend/
#
# Desarrollo local (expone :3001 para scripts npm run seed/reset-password):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Prod-like local (auth solo interno; seed vía http://localhost:8080/invite-user):
#   docker compose up -d --build
#
services:
  auth-server:
    build: ./auth-server
    container_name: lumen-auth
    expose:
      - "3001"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-local-lumen-auth-secret-min-32-chars}
      # URL pública que ve el navegador (Spring hace proxy de /api/auth)
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      AUTH_SERVER_PORT: "3001"
      INVITE_API_SECRET: ${INVITE_API_SECRET:-dev-invite-secret-change-me}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    volumes:
      - auth-sqlite:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: DockerfileDev
    container_name: agilecontainer
    ports:
      - "8080:8080"
    depends_on:
      auth-server:
        condition: service_healthy
    environment:
      AUTH_SERVER_URL: http://auth-server:3001
      INVITE_API_SECRET: ${INVITE_API_SECRET:-dev-invite-secret-change-me}
      LUMEN_PUBLIC_URL: ${LUMEN_PUBLIC_URL:-http://localhost:8080}

volumes:
  auth-sqlite:
