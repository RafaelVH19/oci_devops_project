# Activar con SPRING_PROFILES_ACTIVE=prod (Kubernetes / OCI)
spring.jpa.show-sql=false
logging.level.root=info
logging.level.oracle.ucp=warn
logging.level.org.hibernate.SQL=warn

# Auth interno (ClusterIP / red privada). No exponer :3001 al internet.
auth.server.url=${AUTH_SERVER_URL:http://lumen-auth-service:3001}
auth.server.invite-secret=${INVITE_API_SECRET}

# URL pública de la app (login, invites). Sustituir en el manifiesto K8s.
lumen.public-url=${LUMEN_PUBLIC_URL:}
