spring.jpa.database-platform=org.hibernate.community.dialect.Oracle12cDialect
#oracle.jdbc.fanEnabled=false
##this is not used when deployed in kubernetes. Just for local testing
#spring.datasource.url=jdbc:oracle:thin:@adbps_medium?TNS_ADMIN=/Users/psong/Downloads/Wallet_ADBPS
#spring.datasource.username=admin
#spring.datasource.password=WELcome__12345
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

##Properties of UCP
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.type=oracle.ucp.jdbc.PoolDataSource
spring.datasource.oracleucp.connection-factory-class-name=oracle.jdbc.pool.OracleDataSource
spring.datasource.oracleucp.sql-for-validate-connection=select * from dual
spring.datasource.oracleucp.connection-pool-name=connectionPoolName1
spring.datasource.oracleucp.initial-pool-size=15
spring.datasource.oracleucp.min-pool-size=10
spring.datasource.oracleucp.max-pool-size=30

##Logging properties for UCP
logging.level.root=trace
logging.file.name=logs.log
logging.level.oracle.ucp=trace
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type=TRACE

# Claves locales (mismo lugar que Telegram): application-local.properties
# Copia application-local.properties.example → application-local.properties
spring.config.import=optional:classpath:application-local.properties

deepseek.api.key=sk-test
deepseek.api.url=https://api.deepseek.com/v1/chat/completions

agent.ai.enabled=true
agent.ai.base-url=https://api.groq.com/openai/v1
agent.ai.api-key=${GROQ_API_KEY:${AGENT_AI_API_KEY:}}
agent.ai.model=llama-3.3-70b-versatile

# Google GenAI (Lumi / GenAIChatController) — GEMINI_AI_API_KEY en Docker o application-local
spring.ai.google.genai.api-key=${GEMINI_AI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_AI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-flash-latest

#spring.security.user.name=psong
#spring.security.user.password=WELcome__12345

telegram.bot.token=${TELEGRAM_KEY}
telegram.bot.name=chroma_javabot

# Better Auth bridge (invite creates Oracle + auth-server account)
auth.server.url=${AUTH_SERVER_URL:http://localhost:3001}
auth.server.invite-secret=${INVITE_API_SECRET:dev-invite-secret-change-me}

# Must match BETTER_AUTH_SECRET in auth-server/.env (used to verify JWTs)
better-auth.secret=${BETTER_AUTH_SECRET:replace-with-at-least-32-characters-secret-key}

# Lumen transactional mail (Resend API — no Gmail account in the app UI)
# Get a free key at https://resend.com — use onboarding@resend.dev until you verify a domain
lumen.mail.provider=${LUMEN_MAIL_PROVIDER:resend}
lumen.mail.resend-api-key=${RESEND_API_KEY:}
lumen.mail.from=${LUMEN_MAIL_FROM:Lumen <onboarding@resend.dev>}
lumen.mail.smtp-password=${LUMEN_MAIL_SMTP_PASSWORD:}
# Production public URL (optional). If empty, login links use the browser origin from each invite.
lumen.public-url=${LUMEN_PUBLIC_URL:}


logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE
logging.level.com.nimbusds=TRACE